[package]
name = "probelm-tui"
version = "1.1.0"
edition = "2021"
description = "Terminal User Interface (TUI) for probelm using Ratatui"
license = "MIT"
repository = "https://github.com/keton-id/probelm"
homepage = "https://github.com/keton-id/probelm"
readme = "README.md"
keywords = ["llm", "tui", "ratatui", "benchmark"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
probelm-core = { version = "1.1.0", path = "../probelm-core" }
probelm-adap = { version = "1.1.0", path = "../probelm-adap" }
ratatui = "0.30.2"
crossterm = "0.29.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
