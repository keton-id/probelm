[package]
name = "probelm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Probe and benchmark models on an OpenAI-compatible gateway: ping, latency, throughput, caps"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["llm", "benchmark", "probe", "openai", "cli"]
categories = ["command-line-utilities", "development-tools"]
default-run = "probelm"

[[bin]]
name = "probelm"
path = "src/main.rs"

[[bin]]
name = "mtest"
path = "src/main.rs"

[dependencies]
probelm-proto.workspace = true
probelm-core.workspace = true
probelm-adap.workspace = true
probelm-tui.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
schemars.workspace = true
clap = { version = "4", features = ["derive"] }
inquire = "0.9"
kurir = "0.2"
rmcp = { version = "3.4", default-features = false, features = ["macros", "schemars", "server", "transport-io"] }
