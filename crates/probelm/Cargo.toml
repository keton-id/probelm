[package]
name = "probelm"
version = "1.1.0"
edition = "2021"
description = "Probe and benchmark models on an OpenAI-compatible gateway: ping, latency, throughput, caps"
license = "MIT"
repository = "https://github.com/keton-id/probelm"
homepage = "https://github.com/keton-id/probelm"
readme = "../../README.md"
keywords = ["llm", "benchmark", "probe", "openai", "cli"]
categories = ["command-line-utilities", "development-tools"]
default-run = "probelm"

[[bin]]
name = "probelm"
path = "src/main.rs"

[[bin]]
name = "mtest"
path = "src/main.rs"

[dependencies]
probelm-core = { version = "1.1.0", path = "../probelm-core" }
probelm-adap = { version = "1.1.0", path = "../probelm-adap" }
probelm-tui = { version = "1.1.0", path = "../probelm-tui" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
kurir = "0.2"
inquire = "0.9"
rmcp = { version = "3.4", default-features = false, features = ["macros", "schemars", "server", "transport-io"] }
schemars = "1"
