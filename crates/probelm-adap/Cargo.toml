[package]
name = "probelm-adap"
version = "0.0.0"
edition = "2021"
description = "Provider adapters and connectors for probelm"
license = "MIT"
repository = "https://github.com/keton-id/probelm"
homepage = "https://github.com/keton-id/probelm"
readme = "README.md"
keywords = ["llm", "adapter", "openai", "oauth"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
probelm-core = { version = "0.0.0", path = "../probelm-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
