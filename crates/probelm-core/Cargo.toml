[package]
name = "probelm-core"
version = "0.0.0"
edition = "2021"
description = "Core engine for probelm: models, probing, metrics, and specifications"
license = "MIT"
repository = "https://github.com/keton-id/probelm"
homepage = "https://github.com/keton-id/probelm"
readme = "README.md"
keywords = ["llm", "benchmark", "probe", "openai"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
schemars = "1"
