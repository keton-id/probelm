[package]
name = "midas-model-test"
version = "0.1.0"
edition = "2021"
description = "Probe/test models on a 9Router gateway (ping/latency/caps), table + JSON output"
license = "MIT"

[[bin]]
name = "mtest"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
